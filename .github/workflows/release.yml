name: Release

on:
  push:
    tags:
      # Obsidian requires the release tag to equal manifest.json version, no "v" prefix.
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Build before test: tests/releaseCheck.test.ts runs release-check.mjs,
      # which asserts the build artifacts (main.js) are present.
      - name: Verify (lint, build, test)
        run: |
          npm run lint
          npm run build
          npm test

      - name: Release preflight (versions, tag, artifacts)
        run: npm run release-check

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub release with plugin assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            main.js manifest.json styles.css
